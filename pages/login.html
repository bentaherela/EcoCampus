<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoCampus — Connexion</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/bootstrap-buttons.css" />
  </head>
  <body data-page="login" class="login-body">
    <main class="login-card">
      <div class="login-brand">
        <span class="brand-icon">♻</span>
        <div><b>EcoCampus</b><small>Un campus plus durable</small></div>
      </div>
      <div class="login-tabs" role="tablist">
        <button type="button" class="active" data-tab="in" role="tab">
          Se connecter
        </button>
        <button type="button" data-tab="up" role="tab">Créer un compte</button>
      </div>
      <h1 id="loginTitle">Connexion</h1>
      <p class="login-sub">Accédez au tableau de bord EcoCampus.</p>

      <form id="loginForm" novalidate>
        <label
          >Nom d'utilisateur
          <input id="loginUser" autocomplete="username" required />
        </label>
        <label
          >Mot de passe
          <span class="pwd-wrap">
            <input
              id="loginPass"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="pwd-toggle"
              aria-label="Afficher le mot de passe"
            >
              👁
            </button>
          </span>
        </label>
        <label class="remember"
          ><input type="checkbox" id="loginRemember" /> Rester connecté</label
        >
        <p id="loginError" class="login-error" role="alert" hidden></p>
        <button class="btn btn-success full" type="submit">Se connecter</button>
      </form>

      <form id="signupForm" novalidate hidden>
        <label
          >Nom d'utilisateur<input
            id="suUser"
            autocomplete="username"
            placeholder="3 à 20 caractères"
            required
        /></label>
        <label
          >Mot de passe
          <span class="pwd-wrap">
            <input
              id="suPass"
              type="password"
              autocomplete="new-password"
              placeholder="8 caractères minimum"
              required
            />
            <button
              type="button"
              class="pwd-toggle"
              aria-label="Afficher le mot de passe"
            >
              👁
            </button>
          </span>
        </label>
        <label
          >Confirmer le mot de passe<input
            id="suPass2"
            type="password"
            autocomplete="new-password"
            required
          />
        </label>
        <p id="signupError" class="login-error" role="alert" hidden></p>
        <button class="btn btn-success full" type="submit">
          Créer mon compte
        </button>
      </form>

      <p class="login-hint">
        Compte par défaut : <b>admin</b> / <b>ecocampus2026</b>
      </p>
    </main>
    <script src="../js/script.js"></script>
  </body>
</html>
